name: macOS-Latest

on:
  workflow_dispatch:

jobs:
  mac-gui:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: mac-runner-${{ github.run_id }}

      - name: Setup Virtual Display & Account Auth
        run: |
          # 1. runner ইউজারের জন্য নির্দিষ্ট পাসওয়ার্ড সেটআপ
          echo "runner:macpassword123" | sudo chpasswd
          
          # 2. Virtual Display Simulation (headless crash এড়াতে)
          sudo systemsetup -setdisplaysleep Never 2>/dev/null || true
          
          # 3. Remote Management অন করে নির্দিষ্ট runner ইউজারকে পারমিশন দেওয়া
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -allowAccessFor -specifiedUsers \
            -configure -users runner -access -on -privs -all \
            -clientopts -setvnclegacy -vnclegacy yes \
            -restart -agent

      - name: Display Connection Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=========================================="
          echo "macOS GUI Connection Details:"
          echo "Host: $TS_IP"
          echo "Port: 5900"
          echo "Username: runner"
          echo "Password: macpassword123"
          echo "=========================================="

      - name: Keep Runner Alive
        run: |
          while true; do
            echo "[$(date)] Active..."
            sleep 300
          done
