name: macOS-RoyalTSX-GUI

on:
  workflow_dispatch:

jobs:
  mac-gui:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: mac-runner-${{ github.run_id }}

      - name: Install & Start TigerVNC Server
        run: |
          brew install tigervnc
          mkdir -p ~/.vnc
          echo "macpassword123" | vncpasswd -f > ~/.vnc/passwd
          chmod 600 ~/.vnc/passwd

          # Start TigerVNC Server on Display :1 (Port 5901)
          vncserver :1 -geometry 1280x800 -depth 24

      - name: Display Connection Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=========================================="
          echo "macOS GUI is Ready for Royal TSX!"
          echo "IP Address: $TS_IP"
          echo "Port: 5901"
          echo "Password: macpassword123"
          echo "=========================================="

      - name: Keep Runner Alive
        run: |
          while true; do
            echo "[$(date)] macOS VNC Active..."
            sleep 300
          done
