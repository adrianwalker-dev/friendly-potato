name: macOS-GUI-VNC

on:
  workflow_dispatch:

jobs:
  mac-gui:
    runs-on: macos-latest
    timeout-minutes: 3600

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          hostname: mac-runner-${{ github.run_id }}

      - name: Setup Password & Enable Screen Sharing
        run: |
          # Set password for runner user via dscl using sudo
          sudo dscl . -passwd /Users/runner macpassword123
          
          # Enable Apple Screen Sharing (ARD) for all users
          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -allowAccessFor -allUsers -privs -all \
            -clientopts -setmenuextra -menuextra yes -restart -agent

      - name: Display Connection Info
        run: |
          TS_IP=$(tailscale ip -4)
          echo "=========================================="
          echo "macOS GUI is Ready for Royal TSX!"
          echo "IP Address: $TS_IP"
          echo "Port: 5900"
          echo "Username: runner"
          echo "Password: macpassword123"
          echo "=========================================="

      - name: Keep Runner Alive
        run: |
          while true; do
            echo "[$(date)] macOS VNC Active..."
            sleep 300
          done
